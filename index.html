<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Asim Shahzad | Physics & Mathematics Teacher</title>
  <meta name="description" id="meta-desc" content="Portfolio of Muhammad Asim Shahzad — BS Physics graduate and experienced Physics & Mathematics teacher offering secondary instruction and private home tuition in Sargodha, Pakistan." />
  <meta name="theme-color" id="meta-theme" content="#090b10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" id="favicon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================================
       EXECUTIVE MULTI-TEMPLATE DESIGN SYSTEM (10 Templates × 15 Executive Themes)
       ========================================================================= */
    :root {
      --primary: #3b82f6;
      --secondary: #60a5fa;
      --btn-fg: #ffffff;
      --bg: #090b10;
      --bg2: #10131c;
      --card: #151924;
      --text: #f3f5f9;
      --muted: #98a2b3;
      --radius: 16px;
      --glow: 32px;
      --font-h: 'Plus Jakarta Sans', sans-serif;
      --font-b: 'Inter', sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-poster: 'Bebas Neue', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --speed: .55s;
      --ease: cubic-bezier(.7, 0, .3, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-pop: cubic-bezier(.34, 1.5, .64, 1);

      --grad: linear-gradient(120deg, var(--primary) 0%, var(--secondary) 100%);
      --border: color-mix(in srgb, var(--text) 12%, transparent);
      --border-strong: color-mix(in srgb, var(--text) 22%, transparent);
      --surface: color-mix(in srgb, var(--card) 94%, var(--bg));
      --p10: color-mix(in srgb, var(--primary) 12%, transparent);
      --p20: color-mix(in srgb, var(--primary) 24%, transparent);
      --p40: color-mix(in srgb, var(--primary) 42%, transparent);
    }

    body.theme-light {
      --border: rgba(15, 23, 42, .11);
      --border-strong: rgba(15, 23, 42, .2);
      --surface: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; -webkit-text-size-adjust: 100%; overflow-x: clip; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-b);
      font-size: clamp(14.5px, 1.05vw, 16px); line-height: 1.65;
      overflow-x: clip; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select, textarea { font: inherit; }
    ::selection { background: var(--primary); color: var(--btn-fg); }
    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 9px; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 6px; }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }
    h1, h2, h3, h4 { font-family: var(--font-h); line-height: 1.12; letter-spacing: -.025em; }
    .accent { color: var(--primary); }
    .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

    /* =========================================================================
       FAST DENNIS-STYLE CURVED PRELOADER & SCROLL PROGRESS
       ========================================================================= */
    #progress { position: fixed; top: 0; left: 0; height: 2.5px; width: 0; z-index: 290; background: var(--primary); }
    #preloader {
      position: fixed; inset: 0; z-index: 900; background: #141517; color: #fff;
      display: grid; place-items: center;
      transform: translateY(0); transition: transform .72s var(--ease);
    }
    #preloader.hide { transform: translateY(-112%); pointer-events: none; }
    .pl-curve {
      position: absolute; left: -25%; right: -25%; bottom: -8vh; height: 16vh;
      background: #141517; border-radius: 50%; transition: height .72s var(--ease);
    }
    #preloader.hide .pl-curve { height: 0; }
    .pl-word { display: flex; align-items: center; gap: 14px; font-family: var(--font-h); font-size: clamp(24px, 3.2vw, 38px); font-weight: 600; letter-spacing: -.02em; }
    .pl-word i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); display: block; }

    /* =========================================================================
       MAGNETIC BUTTONS WITH LIQUID FILL-WIPE
       ========================================================================= */
    .btn {
      position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 12px 24px; border-radius: 999px; font-weight: 600; font-size: 14px;
      border: 1px solid var(--border-strong); transition: color .35s var(--ease), border-color .35s var(--ease), transform .25s var(--ease-out);
      isolation: isolate; white-space: nowrap;
    }
    .btn .bfill {
      position: absolute; left: -10%; right: -10%; top: 100%; height: 180%; border-radius: 50%;
      background: var(--primary); z-index: -1; transition: transform .48s var(--ease);
      pointer-events: none;
    }
    .btn:hover .bfill { transform: translateY(-76%); }
    .btn-primary { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); }
    .btn-primary .bfill { background: var(--secondary); }
    .btn-primary:hover { color: var(--btn-fg); border-color: var(--secondary); }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { color: var(--btn-fg); border-color: var(--primary); }

    /* Circular Magnetic CTA */
    .btn-round {
      width: clamp(118px, 11vw, 148px); height: clamp(118px, 11vw, 148px);
      border-radius: 50%; padding: 0; border-color: var(--primary);
      background: var(--primary); color: var(--btn-fg); font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }
    .btn-round .bfill { background: var(--secondary); }

    /* =========================================================================
       TOP NAVBAR + SCROLL-TRIGGERED FLOATING HAMBURGER & CURVED DRAWER
       ========================================================================= */
    .nav {
      position: fixed; inset: 0 0 auto 0; z-index: 240;
      transition: background .35s, border-color .35s, transform .45s var(--ease);
      border-bottom: 1px solid transparent;
    }
    .nav.scrolled {
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-color: var(--border);
    }
    .nav .container { display: flex; align-items: center; justify-content: space-between; height: 70px; gap: 16px; }

    .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-h); font-weight: 700; font-size: 15.5px; flex: none; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: var(--primary); color: var(--btn-fg); font-weight: 800; font-size: 12px; letter-spacing: .04em;
      transition: transform .5s var(--ease);
    }
    .brand:hover .brand-mark { transform: rotate(360deg); }
    .brand-name small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-links a {
      position: relative; padding: 8px 13px; font-size: 13.5px; font-weight: 500; color: var(--muted);
      transition: color .25s; white-space: nowrap;
    }
    .nav-links a::after {
      content: ""; position: absolute; left: 50%; bottom: 1px; width: 5px; height: 5px; border-radius: 50%;
      background: var(--primary); transform: translateX(-50%) scale(0); transition: transform .3s var(--ease);
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-links a:hover::after, .nav-links a.active::after { transform: translateX(-50%) scale(1); }

    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-cta { padding: 9px 18px; font-size: 13px; }
    .mob-open { display: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-strong); place-items: center; color: var(--text); }
    @media(max-width: 920px) { .nav-links, .nav-cta { display: none; } .mob-open { display: grid; } }

    .fab-menu {
      position: fixed; top: 18px; right: 20px; z-index: 270;
      width: 54px; height: 54px; border-radius: 50%;
      background: #1c1d20; border: 1px solid rgba(255,255,255,.18); color: #fff;
      display: grid; place-items: center;
      transform: scale(0); transition: transform .4s var(--ease-pop), background .3s;
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
    }
    .fab-menu.show, .fab-menu.open { transform: scale(1); }
    .fab-menu:hover, .fab-menu.open { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); }
    .fab-lines { width: 20px; height: 10px; position: relative; }
    .fab-lines span { position: absolute; left: 0; right: 0; height: 2px; background: currentColor; border-radius: 2px; transition: transform .35s var(--ease); }
    .fab-lines span:first-child { top: 1px; }
    .fab-lines span:last-child { bottom: 1px; }
    .fab-menu.open .fab-lines span:first-child { transform: translateY(4px) rotate(45deg); }
    .fab-menu.open .fab-lines span:last-child { transform: translateY(-4px) rotate(-45deg); }

    .drawer-scrim {
      position: fixed; inset: 0; z-index: 255; background: rgba(0,0,0,.58); backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity .45s var(--ease);
    }
    .drawer-scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 88vw); z-index: 260;
      background: #16181e; color: #f3f5f9; padding: 88px 36px 32px;
      display: flex; flex-direction: column; justify-content: space-between;
      transform: translateX(calc(100% + 120px)); visibility: hidden; pointer-events: none;
      transition: transform .6s var(--ease), visibility .6s;
    }
    .drawer.open { transform: translateX(0); visibility: visible; pointer-events: auto; }
    .drawer-curve {
      position: absolute; top: -10%; bottom: -10%; left: -54px; width: 110px;
      background: #16181e; border-radius: 50%; transition: width .65s var(--ease), left .65s var(--ease);
      pointer-events: none;
    }
    .drawer.open .drawer-curve { width: 0; left: 0; }
    .drawer-lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: #8c95a6; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 18px; }
    .drawer-links { display: grid; gap: 6px; }
    .drawer-links a { font-family: var(--font-h); font-size: clamp(24px, 4vw, 32px); font-weight: 600; padding: 4px 0; color: #e6ebf2; transition: color .25s, transform .25s; display: flex; align-items: center; gap: 12px; }
    .drawer-links a:hover, .drawer-links a.active { color: var(--primary); transform: translateX(6px); }
    .drawer-foot { padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #98a2b3; }
    .drawer-foot a:hover { color: #fff; }

    /* =========================================================================
       SHARED SECTION ARCHITECTURE
       ========================================================================= */
    .sec { padding: clamp(58px, 7.2vw, 94px) 0; position: relative; }
    .sec.alt { background: var(--bg2); border-block: 1px solid var(--border); }
    .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .sec-head .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); display: block; margin-bottom: 6px; font-weight: 600; }
    .sec-head h2 { font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; }
    .sec-head p { color: var(--muted); font-size: 14.5px; max-width: 460px; margin-top: 6px; }
    .sec-num { font-family: var(--mono); font-size: 13px; color: var(--muted); opacity: .65; }

    .rv { opacity: 0; transform: translateY(22px); transition: opacity .55s var(--ease-out), transform .6s var(--ease-out); transition-delay: var(--d, 0s); }
    .rv.in { opacity: 1; transform: none; }
    body.no-anim .rv { opacity: 1 !important; transform: none !important; transition: none !important; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .card:hover { border-color: var(--p40); transform: translateY(-4px); box-shadow: 0 16px 36px -20px rgba(0,0,0,.45); }
    .chip { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 999px; font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--p10); color: var(--primary); }
    .chip.solid { background: var(--primary); color: var(--btn-fg); }

    /* =========================================================================
       COMPACT PROPORTIONATE PORTRAIT SYSTEM
       ========================================================================= */
    .hero { padding: 108px 0 64px; position: relative; overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 44px; align-items: center; }
    .hero-hello { font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--primary); font-weight: 600; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 10px; }
    .hero-hello::before { content: ""; width: 26px; height: 2px; background: var(--primary); }
    .hero h1 { font-size: clamp(36px, 5.2vw, 62px); font-weight: 800; letter-spacing: -.035em; line-height: 1.04; margin-bottom: 14px; }
    .hero-role { font-family: var(--font-h); font-size: clamp(17px, 2vw, 23px); font-weight: 600; color: var(--muted); margin-bottom: 16px; min-height: 1.4em; }
    .hero-role span { color: var(--primary); }
    .hero-bio { color: var(--muted); max-width: 520px; font-size: 15.5px; line-height: 1.68; margin-bottom: 24px; }
    .hero-cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

    .portrait-box {
      position: relative; width: 100%; max-width: 265px; aspect-ratio: 4 / 4.4;
      margin: 0 auto; justify-self: center;
    }
    .portrait-inner {
      width: 100%; height: 100%; border-radius: 22px; overflow: hidden; position: relative;
      background: var(--card); border: 1.5px solid var(--p40);
      box-shadow: 0 24px 50px -22px rgba(0,0,0,.55);
      transition: transform .45s var(--ease);
    }
    .portrait-box:hover .portrait-inner { transform: translateY(-4px); }
    .portrait-inner img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .portrait-fallback { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--font-h); font-size: 46px; font-weight: 800; color: var(--primary); background: var(--p10); }
    .p-badge {
      position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
      padding: 6px 14px; font-family: var(--mono); font-size: 11px; font-weight: 600; white-space: nowrap;
      box-shadow: 0 10px 24px rgba(0,0,0,.35); display: inline-flex; align-items: center; gap: 7px;
    }
    .p-badge i { color: var(--primary); }

    .marquee { border-block: 1px solid var(--border); background: var(--bg2); overflow: hidden; padding: 14px 0; }
    .mq-track { display: flex; width: max-content; will-change: transform; }
    .mq-item { display: inline-flex; align-items: center; gap: 22px; padding-right: 22px; font-family: var(--font-h); font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .mq-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stat-card { padding: 20px; display: flex; flex-direction: column; gap: 4px; }
    .stat-val { font-family: var(--font-h); font-size: clamp(26px, 3vw, 34px); font-weight: 800; line-height: 1.05; }
    .stat-val b { color: var(--primary); }
    .stat-lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; }

    /* =========================================================================
       ABOUT SECTION
       ========================================================================= */
    .about-split { display: grid; grid-template-columns: 1.45fr 1fr; gap: 44px; align-items: start; }
    .about-lead { font-family: var(--font-h); font-size: clamp(20px, 2.5vw, 29px); font-weight: 600; line-height: 1.38; color: var(--text); }
    .about-side p { color: var(--muted); font-size: 14.8px; line-height: 1.72; margin-bottom: 18px; }
    .about-facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 24px 0; }
    .fact { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
    .fact small { display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .fact strong { font-size: 13.5px; font-weight: 600; }

    /* =========================================================================
       SERVICES
       ========================================================================= */
    .srv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .srv-card { display: flex; flex-direction: column; cursor: pointer; }
    .srv-ic { width: 42px; height: 42px; border-radius: 11px; background: var(--p10); color: var(--primary); display: grid; place-items: center; font-size: 17px; margin-bottom: 16px; transition: background .3s, color .3s; }
    .srv-card:hover .srv-ic { background: var(--primary); color: var(--btn-fg); }
    .srv-card h3 { font-size: 16.5px; margin-bottom: 8px; }
    .srv-card p { font-size: 13.8px; color: var(--muted); line-height: 1.6; flex: 1; }
    .srv-go { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }

    .row-list { border-top: 1px solid var(--border); }
    .row-item {
      display: grid; grid-template-columns: 1.5fr 1fr auto; align-items: center; gap: 16px;
      padding: 24px 8px; border-bottom: 1px solid var(--border); cursor: pointer;
      transition: opacity .3s var(--ease), background .3s;
    }
    .row-item h3 { font-size: clamp(20px, 2.8vw, 32px); font-weight: 700; }
  </style>
</head>
