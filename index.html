  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* =========================================================================
       EXECUTIVE MULTI-TEMPLATE DESIGN SYSTEM (10 Templates × 15 Executive Themes)
       Universal Mobile Browser Compatible (Zero color-mix() lockouts)
       ========================================================================= */
    :root {
      --primary: #3b82f6;
      --secondary: #60a5fa;
      --btn-fg: #ffffff;
      --bg: #090b10;
      --bg2: #10131c;
      --card: #151924;
      --text: #f3f5f9;
      --muted: #98a2b3;
      --radius: 16px;
      --glow: 32px;
      --font-h: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-b: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-poster: 'Bebas Neue', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --speed: .55s;
      --ease: cubic-bezier(.7, 0, .3, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-pop: cubic-bezier(.34, 1.5, .64, 1);

      --grad: linear-gradient(120deg, var(--primary) 0%, var(--secondary) 100%);
      /* Rock-solid RGBA fallbacks (updated dynamically by JS for every theme) */
      --border: rgba(243, 245, 249, .12);
      --border-strong: rgba(243, 245, 249, .22);
      --surface: #151924;
      --nav-bg: rgba(9, 11, 16, .92);
      --hero-dennis-bg: #151822;
      --p10: rgba(59, 130, 246, .14);
      --p20: rgba(59, 130, 246, .24);
      --p40: rgba(59, 130, 246, .42);
    }

    body.theme-light {
      --border: rgba(15, 23, 42, .11);
      --border-strong: rgba(15, 23, 42, .20);
      --surface: #ffffff;
      --nav-bg: rgba(255, 255, 255, .92);
      --hero-dennis-bg: #eef2f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 76px;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-b);
      font-size: 15.5px; line-height: 1.65;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select, textarea { font: inherit; }
    ::selection { background: var(--primary); color: var(--btn-fg); }
    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 9px; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 6px; }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }
    h1, h2, h3, h4 { font-family: var(--font-h); line-height: 1.14; letter-spacing: -.025em; }
    .accent { color: var(--primary); }
    .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--primary); }

    /* =========================================================================
       FAIL-SAFE PRELOADER (Auto-hides via CSS even if JS is slow/blocked!)
       ========================================================================= */
    #progress { position: fixed; top: 0; left: 0; height: 2.5px; width: 0; z-index: 290; background: var(--primary); }
    #preloader {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 900;
      background: #141517; color: #fff;
      display: flex; align-items: center; justify-content: center;
      transform: translateY(0);
      transition: transform .65s var(--ease), opacity .4s ease, visibility .65s;
      /* Pure CSS failsafe: NEVER traps any phone on "Hello" */
      animation: plFailsafe .5s ease 1.6s forwards;
    }
    @keyframes plFailsafe {
      to { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-100%); }
    }
    #preloader.hide {
      transform: translateY(-112%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pl-curve {
      position: absolute; left: -25%; right: -25%; bottom: -8vh; height: 16vh;
      background: #141517; border-radius: 50%; transition: height .65s var(--ease);
    }
    #preloader.hide .pl-curve { height: 0; }
    .pl-word { display: flex; align-items: center; gap: 14px; font-family: var(--font-h); font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
    .pl-word i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); display: block; }

    /* =========================================================================
       MAGNETIC BUTTONS WITH LIQUID FILL-WIPE
       ========================================================================= */
    .btn {
      position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 12px 24px; border-radius: 999px; font-weight: 600; font-size: 14px;
      border: 1px solid var(--border-strong); transition: color .35s var(--ease), border-color .35s var(--ease), transform .25s var(--ease-out);
      isolation: isolate; white-space: nowrap;
    }
    .btn .bfill {
      position: absolute; left: -10%; right: -10%; top: 100%; height: 180%; border-radius: 50%;
      background: var(--primary); z-index: -1; transition: transform .48s var(--ease);
      pointer-events: none;
    }
    .btn:hover .bfill { transform: translateY(-76%); }
    .btn-primary { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); }
    .btn-primary .bfill { background: var(--secondary); }
    .btn-primary:hover { color: var(--btn-fg); border-color: var(--secondary); }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { color: var(--btn-fg); border-color: var(--primary); }

    .btn-round {
      width: 132px; height: 132px;
      border-radius: 50%; padding: 0; border-color: var(--primary);
      background: var(--primary); color: var(--btn-fg); font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }
    .btn-round .bfill { background: var(--secondary); }

    /* =========================================================================
       TOP NAVBAR + FLOATING HAMBURGER & SLIDE-OUT DRAWER
       ========================================================================= */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 240;
      transition: background .35s, border-color .35s, transform .45s var(--ease);
      border-bottom: 1px solid transparent;
    }
    .nav.scrolled {
      background: var(--nav-bg);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-color: var(--border);
    }
    .nav .container { display: flex; align-items: center; justify-content: space-between; height: 70px; gap: 12px; }

    .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-h); font-weight: 700; font-size: 15.5px; flex: 0 1 auto; min-width: 0; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: var(--primary); color: var(--btn-fg); font-weight: 800; font-size: 12px; letter-spacing: .04em;
      transition: transform .5s var(--ease);
    }
    .brand:hover .brand-mark { transform: rotate(360deg); }
    .brand-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .brand-name small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-links a {
      position: relative; padding: 8px 12px; font-size: 13.5px; font-weight: 500; color: var(--muted);
      transition: color .25s; white-space: nowrap;
    }
    .nav-links a::after {
      content: ""; position: absolute; left: 50%; bottom: 1px; width: 5px; height: 5px; border-radius: 50%;
      background: var(--primary); transform: translateX(-50%) scale(0); transition: transform .3s var(--ease);
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-links a:hover::after, .nav-links a.active::after { transform: translateX(-50%) scale(1); }

    .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-cta { padding: 9px 18px; font-size: 13px; }
    .mob-open { display: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-strong); align-items: center; justify-content: center; color: var(--text); flex-shrink: 0; }
    @media(max-width: 920px) { .nav-links, .nav-cta { display: none; } .mob-open { display: flex; } }

    .fab-menu {
      position: fixed; top: 18px; right: 20px; z-index: 270;
      width: 50px; height: 50px; border-radius: 50%;
      background: #1c1d20; border: 1px solid rgba(255,255,255,.18); color: #fff;
      display: flex; align-items: center; justify-content: center;
      transform: scale(0); transition: transform .4s var(--ease-pop), background .3s;
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
    }
    .fab-menu.show, .fab-menu.open { transform: scale(1); }
    .fab-menu:hover, .fab-menu.open { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); }
    @media(max-width: 920px) { .fab-menu:not(.open) { display: none; } }
    .fab-lines { width: 20px; height: 10px; position: relative; display: block; }
    .fab-lines span { position: absolute; left: 0; right: 0; height: 2px; background: currentColor; border-radius: 2px; transition: transform .35s var(--ease); }
    .fab-lines span:first-child { top: 1px; }
    .fab-lines span:last-child { bottom: 1px; }
    .fab-menu.open .fab-lines span:first-child { transform: translateY(4px) rotate(45deg); }
    .fab-menu.open .fab-lines span:last-child { transform: translateY(-4px) rotate(-45deg); }

    .drawer-scrim {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 255; background: rgba(0,0,0,.62);
      opacity: 0; pointer-events: none; transition: opacity .4s var(--ease);
    }
    .drawer-scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 86vw; z-index: 260;
      background: #16181e; color: #f3f5f9; padding: 80px 28px 28px;
      display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto;
      transform: translateX(105%); visibility: hidden; pointer-events: none;
      transition: transform .45s var(--ease), visibility .45s;
    }
    .drawer.open { transform: translateX(0); visibility: visible; pointer-events: auto; }
    .drawer-lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: #8c95a6; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 16px; }
    .drawer-links { display: grid; gap: 6px; }
    .drawer-links a { font-family: var(--font-h); font-size: 22px; font-weight: 600; padding: 6px 0; color: #e6ebf2; transition: color .25s, transform .25s; display: flex; align-items: center; gap: 10px; }
    .drawer-links a:hover, .drawer-links a.active { color: var(--primary); transform: translateX(6px); }
    .drawer-foot { padding-top: 16px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,.12); display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #98a2b3; }
    .drawer-foot a:hover { color: #fff; }

    /* =========================================================================
       SHARED SECTION ARCHITECTURE
       ========================================================================= */
    .sec { padding: 76px 0; position: relative; }
    .sec.alt { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 34px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .sec-head .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); display: block; margin-bottom: 6px; font-weight: 600; }
    .sec-head h2 { font-size: 36px; font-weight: 800; }
    .sec-head p { color: var(--muted); font-size: 14.5px; max-width: 480px; margin-top: 6px; }
    .sec-num { font-family: var(--mono); font-size: 13px; color: var(--muted); opacity: .65; }

    /* Safe Scroll Reveal: visible by default if JS hasn't armed it yet */
    .rv { transition: opacity .5s var(--ease-out), transform .55s var(--ease-out); transition-delay: var(--d, 0s); }
    body.anim-armed .rv:not(.in) { opacity: 0; transform: translateY(18px); }
    body.anim-armed .rv.in, body.no-anim .rv { opacity: 1 !important; transform: none !important; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .card:hover { border-color: var(--p40); transform: translateY(-3px); box-shadow: 0 16px 36px -20px rgba(0,0,0,.45); }
    .chip { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 999px; font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--p10); color: var(--primary); }
    .chip.solid { background: var(--primary); color: var(--btn-fg); }

    /* Social Icon Pills */
    .soc-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .soc-btn {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center;
      font-size: 15px; transition: all .25s;
    }
    .soc-btn:hover { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); transform: translateY(-2px); }

    /* =========================================================================
       HERO & PORTRAIT
       ========================================================================= */
    .hero { padding: 108px 0 60px; position: relative; overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 44px; align-items: center; }
    .hero-hello { font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--primary); font-weight: 600; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 10px; }
    .hero-hello::before { content: ""; width: 26px; height: 2px; background: var(--primary); }
    .hero h1 { font-size: 54px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin-bottom: 14px; }
    .hero-role { font-family: var(--font-h); font-size: 21px; font-weight: 600; color: var(--muted); margin-bottom: 16px; min-height: 1.4em; }
    .hero-role span { color: var(--primary); }
    .hero-bio { color: var(--muted); max-width: 520px; font-size: 15.5px; line-height: 1.68; margin-bottom: 24px; }
    .hero-cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

    .portrait-box {
      position: relative; width: 265px; max-width: 100%; height: 295px;
      margin: 0 auto; justify-self: center;
    }
    .portrait-inner {
      width: 100%; height: 100%; border-radius: 22px; overflow: hidden; position: relative;
      background: var(--card); border: 1.5px solid var(--p40);
      box-shadow: 0 24px 50px -22px rgba(0,0,0,.55);
      transition: transform .45s var(--ease);
    }
    .portrait-box:hover .portrait-inner { transform: translateY(-4px); }
    .portrait-inner img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .portrait-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--font-h); font-size: 46px; font-weight: 800; color: var(--primary); background: var(--p10); }
    .p-badge {
      position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
      padding: 6px 14px; font-family: var(--mono); font-size: 11px; font-weight: 600; white-space: nowrap;
      box-shadow: 0 10px 24px rgba(0,0,0,.35); display: inline-flex; align-items: center; gap: 7px; z-index: 3;
    }
    .p-badge i { color: var(--primary); }

    .marquee { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg2); overflow: hidden; padding: 14px 0; }
    .mq-track { display: flex; width: max-content; will-change: transform; }
    .mq-item { display: inline-flex; align-items: center; gap: 22px; padding-right: 22px; font-family: var(--font-h); font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .mq-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stat-card { padding: 20px; display: flex; flex-direction: column; gap: 4px; }
    .stat-val { font-family: var(--font-h); font-size: 32px; font-weight: 800; line-height: 1.05; }
    .stat-val b { color: var(--primary); }
    .stat-lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; }

    /* =========================================================================
       ABOUT, SERVICES, SKILLS, EXPERIENCE, EDUCATION, HIGHLIGHTS
       ========================================================================= */
    .about-split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
    .about-lead { font-family: var(--font-h); font-size: 26px; font-weight: 600; line-height: 1.38; color: var(--text); }
    .about-side p { color: var(--muted); font-size: 14.8px; line-height: 1.72; margin-bottom: 16px; }
    .about-facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
    .fact { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
    .fact small { display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .fact strong { font-size: 13.5px; font-weight: 600; }

    .srv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .srv-card { display: flex; flex-direction: column; cursor: pointer; }
    .srv-ic { width: 42px; height: 42px; border-radius: 11px; background: var(--p10); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 17px; margin-bottom: 16px; transition: background .3s, color .3s; }
    .srv-card:hover .srv-ic { background: var(--primary); color: var(--btn-fg); }
    .srv-card h3 { font-size: 16.5px; margin-bottom: 8px; }
    .srv-card p { font-size: 13.8px; color: var(--muted); line-height: 1.6; flex: 1; }
    .srv-go { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }

    .row-list { border-top: 1px solid var(--border); }
    .row-item {
      display: grid; grid-template-columns: 1.4fr 1fr auto; align-items: center; gap: 16px;
      padding: 22px 8px; border-bottom: 1px solid var(--border); cursor: pointer;
      transition: opacity .3s var(--ease), background .3s;
    }
    .row-item h3 { font-size: 26px; font-weight: 600; transition: transform .35s var(--ease); }
    .row-item .row-meta { color: var(--muted); font-size: 14px; transition: transform .35s var(--ease); }
    .row-item .row-arrow { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all .3s var(--ease); flex-shrink: 0; }
    .row-item:hover h3 { transform: translateX(-6px); color: var(--primary); }
    .row-item:hover .row-arrow { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); transform: rotate(-45deg); }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .tab { padding: 7px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); color: var(--muted); transition: all .25s; }
    .tab:hover { color: var(--text); border-color: var(--border-strong); }
    .tab.active { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); }

    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 36px; }
    .sk-top { display: flex; justify-content: space-between; font-size: 13.8px; font-weight: 600; margin-bottom: 7px; }
    .sk-top b { font-family: var(--mono); font-size: 12px; color: var(--primary); }
    .sk-track { height: 7px; border-radius: 99px; background: var(--border); overflow: hidden; }
    .sk-fill { height: 100%; width: 0; border-radius: 99px; background: var(--grad); transition: width 1s var(--ease-out); }

    .rings-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .ring-item { text-align: center; padding: 18px 12px; }
    .ring-svg { width: 88px; height: 88px; margin: 0 auto 10px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .ring-fg { fill: none; stroke: var(--primary); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 226; stroke-dashoffset: 226; transition: stroke-dashoffset 1.1s var(--ease-out); }
    .ring-val { font-family: var(--mono); font-size: 15px; font-weight: 700; margin-top: -58px; margin-bottom: 36px; }
    .ring-name { font-size: 12.5px; font-weight: 600; color: var(--muted); }

    .exp-list { position: relative; padding-left: 28px; display: grid; gap: 16px; }
    .exp-list::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
    .exp-item { position: relative; }
    .exp-dot { position: absolute; left: -28px; top: 24px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--primary); }
    .exp-item.cur .exp-dot { background: var(--primary); box-shadow: 0 0 0 5px var(--p20); }
    .exp-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .exp-top h3 { font-size: 17.5px; }
    .exp-org { font-size: 13.5px; font-weight: 600; color: var(--primary); margin-bottom: 10px; }
    .exp-pts { display: grid; gap: 6px; }
    .exp-pts li { font-size: 13.8px; color: var(--muted); padding-left: 16px; position: relative; }
    .exp-pts li::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }

    .edu-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start; }
    .col-h { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 9px; color: var(--text); }
    .col-h i { color: var(--primary); }
    .stack { display: grid; gap: 12px; }
    .edu-card h4 { font-size: 15.5px; margin: 6px 0 3px; }
    .edu-card .inst { font-size: 13px; color: var(--primary); font-weight: 600; }
    .edu-card p { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .hl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .hl-card .hl-num { font-family: var(--mono); font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 12px; display: block; }
    .hl-card h4 { font-size: 17px; margin-bottom: 8px; }
    .hl-card p { font-size: 13.8px; color: var(--muted); line-height: 1.62; }

    /* Custom Sections Support (Page Builder) */
    .cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .cs-grid.c1 { grid-template-columns: 1fr; }
    .cs-grid.c2 { grid-template-columns: repeat(2, 1fr); }
    .cs-grid.c4 { grid-template-columns: repeat(4, 1fr); }
    .cs-img { width: 100%; height: 190px; object-fit: cover; border-radius: 10px; margin-bottom: 14px; background: var(--bg); }
    .cs-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .cs-faq details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 10px; }
    .cs-faq summary { font-weight: 700; cursor: pointer; font-size: 15.5px; }
    .cs-faq p { color: var(--muted); margin-top: 10px; font-size: 14px; }
    .cs-cta { text-align: center; padding: 44px 28px; background: linear-gradient(135deg, var(--p20), var(--surface)); border: 1px solid var(--p40); border-radius: var(--radius); }
    .cs-cta h2 { font-size: 32px; margin-bottom: 12px; }
    .cs-cta p { color: var(--muted); max-width: 560px; margin: 0 auto 22px; }

    /* =========================================================================
       CURVED FOOTER TRANSITION + CONTACT FORM
       ========================================================================= */
    .curve-sep { position: relative; height: 50px; overflow: hidden; background: var(--bg2); }
    .curve-sep span { position: absolute; left: -20%; right: -20%; top: -180px; height: 230px; background: var(--bg); border-radius: 50%; }

    .contact-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: start; }
    .c-list { display: grid; gap: 10px; }
    .c-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); transition: border-color .25s; }
    .c-row:hover { border-color: var(--p40); }
    .c-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--p10); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .c-row small { display: block; font-size: 11px; color: var(--muted); }
    .c-row strong, .c-row a { font-size: 13.5px; font-weight: 600; word-break: break-word; }

    .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fg { margin-bottom: 12px; }
    .fg label { display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 5px; }
    .fg input, .fg select, .fg textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px;
      padding: 0 13px; color: var(--text); font-size: 14px; outline: none; transition: border-color .25s;
    }
    .fg input, .fg select { height: 46px; line-height: 46px; }
    .fg textarea { padding: 11px 13px; resize: vertical; min-height: 108px; line-height: 1.55; }
    .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--primary); }
    .fg select option { background: var(--card); color: var(--text); }
    .hp { position: absolute; left: -9999px; opacity: 0; }
    .f-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .f-actions .btn { flex: 1; min-width: 160px; }
    .btn-wa-clean { border-color: rgba(16,185,129,.45); color: var(--text); }
    .btn-wa-clean i { color: #10b981; }
    .btn-wa-clean .bfill { background: #059669; }
    .btn-wa-clean:hover { color: #fff; border-color: #059669; }
    .btn-wa-clean:hover i { color: #fff; }
    .status { display: none; margin-top: 12px; padding: 11px 14px; border-radius: 10px; font-size: 13.5px; }
    .status.show { display: block; }
    .status.ok { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.35); color: #34d399; }
    .status.warn { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); color: #fbbf24; }
    .status.info { background: var(--p10); border: 1px solid var(--p40); color: var(--primary); }

    footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 40px 0 28px; }
    .f-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
    .f-brand { min-width: 0; max-width: 100%; }
    .f-meta { display: flex; flex-wrap: wrap; gap: 24px; font-size: 12.5px; color: var(--muted); }
    .f-meta small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-bottom: 2px; }
    .f-meta b { color: var(--text); font-weight: 600; }
    .f-copy { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); padding-right: 54px; }
    .f-soc { display: flex; gap: 14px; flex-wrap: wrap; }
    .f-soc a:hover { color: var(--primary); }

    #toTop {
      position: fixed; right: 16px; bottom: 16px; z-index: 230; width: 42px; height: 42px; border-radius: 50%;
      background: var(--primary); color: var(--btn-fg); display: flex; align-items: center; justify-content: center; font-size: 13px;
      opacity: 0; visibility: hidden; transform: translateY(12px); transition: all .3s var(--ease);
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }
    #toTop.show { opacity: 1; visibility: visible; transform: none; }

    /* =========================================================================
       TEMPLATE-SPECIFIC ARCHITECTURAL OVERRIDES (10 Full Distinct Templates)
       ========================================================================= */
    body[data-template="dennis"] .hero { background: var(--hero-dennis-bg); padding-bottom: 36px; }
    body[data-template="dennis"] .hero-marquee-big {
      margin-top: 32px; overflow: hidden; border-top: 1px solid var(--border); padding-top: 18px;
    }
    body[data-template="dennis"] .hero-marquee-big .mq-item {
      font-size: 56px; font-weight: 700; color: var(--text); letter-spacing: -.03em; gap: 36px; padding-right: 36px;
    }

    body[data-template="editorial-light"] .nav .container { justify-content: center; }
    body[data-template="editorial-light"] .nav-pill-bar {
      display: flex; align-items: center; gap: 14px; padding: 6px 10px 6px 8px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
      box-shadow: 0 8px 24px -12px rgba(0,0,0,.12); max-width: 100%;
    }
    body[data-template="editorial-light"] .hero h1 .italic-line {
      font-family: var(--font-serif); font-style: italic; font-weight: 500; color: var(--primary); display: block;
    }
    body[data-template="editorial-light"] .portrait-inner {
      border-radius: 28px; border-color: transparent;
      box-shadow: 0 24px 60px -18px var(--p40);
    }

    body[data-template="gold-noir"] .portrait-box::before {
      content: ""; position: absolute; left: -14px; top: 14px; bottom: -14px; width: 42%;
      background: var(--primary); border-radius: 18px; z-index: 0;
    }
    body[data-template="gold-noir"] .portrait-inner { position: relative; z-index: 1; border-radius: 18px; border-color: transparent; }
    body[data-template="gold-noir"] .hero-grid { grid-template-columns: .78fr 1.22fr; }
    body[data-template="gold-noir"] .portrait-box { order: -1; }
    body[data-template="gold-noir"] .sec-head { justify-content: center; text-align: center; border-bottom: 0; }
    body[data-template="gold-noir"] .sec-head p { margin-left: auto; margin-right: auto; }
    body[data-template="gold-noir"] .sec-num { display: none; }

    body[data-template="cyber-wave"] .hero {
      background: radial-gradient(60% 50% at 50% 35%, var(--p20), transparent 72%), var(--bg);
    }
    body[data-template="cyber-wave"] .hero-grid { grid-template-columns: 1fr 250px 1fr; gap: 28px; text-align: left; }
    body[data-template="cyber-wave"] .cw-right { text-align: right; }
    body[data-template="cyber-wave"] .cw-right .hero-cta-row { justify-content: flex-end; }
    body[data-template="cyber-wave"] .cw-roles { display: grid; gap: 10px; margin-top: 18px; }
    body[data-template="cyber-wave"] .cw-roles span { font-size: 13px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    body[data-template="cyber-wave"] .cw-roles span::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

    body[data-template="crimson-poster"] .hero-poster-bg {
      position: absolute; top: 74px; left: 0; right: 0; text-align: center; pointer-events: none; user-select: none;
      font-family: var(--font-poster); font-size: 180px; line-height: .84;
      color: var(--primary); opacity: .20; letter-spacing: .04em; z-index: 0;
    }
    body[data-template="crimson-poster"] .hero h1 { font-family: var(--font-poster); font-size: 74px; letter-spacing: .03em; font-weight: 400; line-height: .95; }
    body[data-template="crimson-poster"] .hero-grid { grid-template-columns: 1.05fr 250px .8fr; gap: 28px; align-items: center; }
    body[data-template="crimson-poster"] .poster-stats { display: grid; gap: 14px; text-align: right; }
    body[data-template="crimson-poster"] .poster-stats div { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    body[data-template="crimson-poster"] .poster-stats b { font-family: var(--font-poster); font-size: 38px; color: var(--primary); line-height: 1; display: block; }
    body[data-template="crimson-poster"] .poster-stats small { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

    body[data-template="obsidian-amber"] .portrait-box::after {
      content: ""; position: absolute; top: -14px; right: -14px; bottom: -14px; left: -14px; border-radius: 50%;
      border: 2px solid var(--p40); box-shadow: 0 0 36px var(--p20); pointer-events: none; z-index: 0;
    }
    body[data-template="obsidian-amber"] .portrait-inner { border-radius: 50%; position: relative; z-index: 1; }
    body[data-template="obsidian-amber"] .portrait-box { width: 250px; height: 250px; }
    body[data-template="obsidian-amber"] .srv-card { border-top: 2px solid var(--p40); }

    body[data-template="octagon"] {
      background-image: radial-gradient(var(--p10) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    body[data-template="octagon"] .portrait-box { width: 255px; height: 255px; }
    body[data-template="octagon"] .portrait-inner {
      border-radius: 0; border: 0;
      clip-path: polygon(29% 0%, 71% 0%, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0% 71%, 0% 29%);
      box-shadow: none;
    }
    body[data-template="octagon"] .oct-ring-svg {
      position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; pointer-events: none; z-index: 0;
      animation: octSpin 26s linear infinite;
    }
    @keyframes octSpin { to { transform: rotate(360deg); } }
    body.no-anim .oct-ring-svg { animation: none; }
    body[data-template="octagon"] .srv-ic,
    body[data-template="octagon"] .c-ic {
      border-radius: 0;
      clip-path: polygon(26% 0%, 74% 0%, 100% 26%, 100% 74%, 74% 100%, 26% 100%, 0% 74%, 0% 26%);
    }

    body[data-template="forest-amber"] .nav .container {
      background: #284632; color: #f8faf8; border-radius: 999px; height: 58px;
      margin-top: 10px; padding: 0 12px 0 18px;
      box-shadow: 0 10px 26px -12px rgba(0,0,0,.28);
    }
    body[data-template="forest-amber"] .nav.scrolled { background: transparent; border-color: transparent; backdrop-filter: none; }
    body[data-template="forest-amber"] .nav-links a { color: rgba(255,255,255,.78); }
    body[data-template="forest-amber"] .nav-links a:hover,
    body[data-template="forest-amber"] .nav-links a.active { color: var(--primary); }
    body[data-template="forest-amber"] .nav .brand { color: #fff; }
    body[data-template="forest-amber"] .nav .brand small { color: rgba(255,255,255,.65); }
    body[data-template="forest-amber"] .nav .nav-cta { background: #fff; color: #1b3122; border-color: #fff; }
    body[data-template="forest-amber"] .hero-hello { border: 1.5px solid var(--border-strong); padding: 4px 12px; border-radius: 4px; }
    body[data-template="forest-amber"] .hero-hello::before { display: none; }
    body[data-template="forest-amber"] .portrait-box::before {
      content: ""; position: absolute; top: 8%; right: -6%; bottom: -4%; left: -6%; border-radius: 54% 46% 48% 52% / 44% 52% 48% 56%;
      background: var(--primary); opacity: .92; z-index: 0;
    }
    body[data-template="forest-amber"] .portrait-inner { position: relative; z-index: 1; border-radius: 26px; border-color: transparent; }
    body[data-template="forest-amber"] .marquee { background: var(--primary); border-top: 4px solid #284632; border-bottom: 4px solid #284632; padding: 12px 0; }
    body[data-template="forest-amber"] .marquee .mq-item { color: #142218; font-weight: 700; }
    body[data-template="forest-amber"] .marquee .mq-dot { background: #142218; }
    body[data-template="forest-amber"] #about { background: #284632; color: #f4f7f5; }
    body[data-template="forest-amber"] #about .about-lead,
    body[data-template="forest-amber"] #about h2,
    body[data-template="forest-amber"] #about strong { color: #fff; }
    body[data-template="forest-amber"] #about p,
    body[data-template="forest-amber"] #about small { color: rgba(255,255,255,.78); }
    body[data-template="forest-amber"] #about .fact { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); }

    body[data-template="midnight-horizon"] .hero {
      background: linear-gradient(180deg, rgba(14,16,26,.55) 0%, var(--bg) 100%),
                  radial-gradient(ellipse 80% 60% at 50% 25%, var(--p20), transparent 70%), #131622;
      text-align: center; padding: 118px 0 74px;
    }
    body[data-template="midnight-horizon"] .hero-grid { grid-template-columns: 1fr; justify-items: center; gap: 20px; }
    body[data-template="midnight-horizon"] .portrait-box { order: -1; width: 148px; height: 148px; }
    body[data-template="midnight-horizon"] .portrait-inner { border-radius: 50%; border: 3px solid var(--p40); }
    body[data-template="midnight-horizon"] .hero-hello,
    body[data-template="midnight-horizon"] .hero-cta-row,
    body[data-template="midnight-horizon"] .soc-row { justify-content: center; }
    body[data-template="midnight-horizon"] .hero-bio { margin-left: auto; margin-right: auto; }
    body[data-template="midnight-horizon"] .card { border-radius: 6px; border-color: var(--p20); }
    body[data-template="midnight-horizon"] .btn { border-radius: 6px; }
    body[data-template="midnight-horizon"] .sec-num { font-size: 28px; color: var(--border-strong); opacity: .7; }

    body[data-template="nordic-slate"] .brand-name { font-family: var(--font-serif); font-style: italic; font-size: 18px; }
    body[data-template="nordic-slate"] .portrait-box { width: 250px; height: 250px; }
    body[data-template="nordic-slate"] .portrait-inner { border-radius: 50%; border: 2px solid var(--border-strong); position: relative; z-index: 1; }
    body[data-template="nordic-slate"] .radial-svg {
      position: absolute; top: -16%; left: -16%; width: 132%; height: 132%; pointer-events: none; z-index: 0;
      opacity: .55; animation: octSpin 40s linear infinite;
    }
    body.no-anim .radial-svg { animation: none; }
    body[data-template="nordic-slate"] .btn { border-radius: 6px; }
    body[data-template="nordic-slate"] .card { border-radius: 8px; }
    body[data-template="nordic-slate"] .srv-card:first-child { background: var(--primary); color: var(--btn-fg); border-color: var(--primary); }
    body[data-template="nordic-slate"] .srv-card:first-child p,
    body[data-template="nordic-slate"] .srv-card:first-child .srv-go { color: var(--btn-fg); opacity: .92; border-color: rgba(255,255,255,.25); }
    body[data-template="nordic-slate"] .srv-card:first-child .srv-ic { background: rgba(255,255,255,.18); color: var(--btn-fg); }
    body[data-template="nordic-slate"] .sk-track { height: 4px; }

    /* =========================================================================
       PRINTABLE CV MODAL
       ========================================================================= */
    #cv-modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 500; background: rgba(0,0,0,.82); overflow-y: auto; padding: 16px; display: none; }
    #cv-modal.open { display: block; }
    .cv-bar { max-width: 820px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--border); border-radius: 14px 14px 0 0; padding: 12px 16px; }
    .cv-sheet { max-width: 820px; margin: 0 auto 36px; background: #fff; color: #111827; padding: 36px; border-radius: 0 0 14px 14px; font-family: 'Inter', sans-serif; font-size: 13.5px; line-height: 1.55; }
    .cv-name { font-size: 24px; font-weight: 800; text-transform: uppercase; color: #111827; }
    .cv-role { color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .08em; margin-top: 4px; }
    .cv-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid #111827; padding-bottom: 14px; margin-bottom: 16px; }
    .cv-contact { font-size: 12px; color: #374151; text-align: right; }
    .cv-sheet h2 { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; border-bottom: 1px solid #d1d5db; padding-bottom: 4px; margin: 18px 0 9px; color: #111827; }
    .cv-row { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; color: #111827; flex-wrap: wrap; }
    .cv-sheet ul { padding-left: 18px; color: #374151; margin: 4px 0 10px; list-style: disc; }
    .cv-comp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 12px; color: #1f2937; }
    @media print {
      body > *:not(#cv-modal) { display: none !important; }
      #cv-modal { position: static; display: block !important; background: none; padding: 0; }
      .cv-bar { display: none !important; }
      .cv-sheet { margin: 0; max-width: none; border-radius: 0; padding: 0; }
    }

    /* =========================================================================
       MOBILE RESPONSIVE PRECISION (Tested 320px to 960px)
       ========================================================================= */
    @media(max-width: 960px) {
      .hero-grid, body[data-template="gold-noir"] .hero-grid,
      body[data-template="cyber-wave"] .hero-grid,
      body[data-template="crimson-poster"] .hero-grid { grid-template-columns: 1fr; text-align: center; gap: 26px; }
      body[data-template="cyber-wave"] .cw-right,
      body[data-template="crimson-poster"] .poster-stats { text-align: center; }
      body[data-template="crimson-poster"] .poster-stats { grid-template-columns: repeat(3, 1fr); }
      .portrait-box { width: 185px; height: 210px; order: -1; }
      body[data-template="obsidian-amber"] .portrait-box,
      body[data-template="octagon"] .portrait-box,
      body[data-template="nordic-slate"] .portrait-box { width: 185px; height: 185px; order: -1; }
      .hero-hello, .hero-cta-row, .soc-row { justify-content: center; }
      .hero-bio { margin-left: auto; margin-right: auto; }
      .about-split, .edu-grid, .contact-grid { grid-template-columns: 1fr; gap: 24px; }
      .srv-grid, .cs-grid, .cs-grid.c4 { grid-template-columns: repeat(2, 1fr); }
      .hl-grid { grid-template-columns: 1fr; }
      .rings-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 640px) {
      body { font-size: 14.5px; }
      .container { padding: 0 16px; }
      .nav .container { height: 60px; }
      .hero { padding: 84px 0 42px; }
      .portrait-box { width: 160px; height: 182px; }
      body[data-template="obsidian-amber"] .portrait-box,
      body[data-template="octagon"] .portrait-box,
      body[data-template="nordic-slate"] .portrait-box { width: 160px; height: 160px; }
      body[data-template="midnight-horizon"] .portrait-box { width: 128px; height: 128px; }
      body[data-template="forest-amber"] .nav .container { margin-top: 6px; border-radius: 14px; }

  r.setProperty('--hero-dennis-bg', isLight ? (palette.bg2 || '#eef2f6') : (palette.bg2 || '#151822'));

  r.setProperty('--p20', rgbaStr(palette.primary || '#3b82f6', 0.24));
  r.setProperty('--p40', rgbaStr(palette.primary || '#3b82f6', 0.42));

  var fav = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='" + (palette.primary || '#3b82f6') + "'/><text x='24' y='30' text-anchor='middle' font-family='Arial' font-weight='800' font-size='14' fill='" + fg + "'>" + ini + "</text></svg>";
  var favEl = $('#favicon');
  if (favEl) favEl.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
}

function show(k) {
  return !(CFG.sections && CFG.sections[k] && CFG.sections[k].show === false);
}

function activeSocials() {
  var list = [];
  var plats = (CFG.socials && CFG.socials.platforms) ? CFG.socials.platforms : {};
  Object.keys(SOCIAL_META).forEach(function(k) {
    var p = plats[k];
    if (p && p.enabled && p.url) {
      list.push({ key: k, name: SOCIAL_META[k].name, icon: SOCIAL_META[k].icon, url: safeUrl(p.url) });
    }
  });
  if (!list.length && CFG.profile && CFG.profile.linkedin) {
    list.push({ key: 'linkedin', name: 'LinkedIn', icon: 'fa-brands fa-linkedin-in', url: safeUrl(CFG.profile.linkedin) });
  }
  return list;
}

function renderSocialIconsHTML() {
  var list = activeSocials();
  if (!list.length) return '';
  return '<div class="soc-row">' + list.map(function(s) {
    return '<a class="soc-btn" href="' + esc(s.url) + '" target="_blank" rel="noopener" aria-label="' + esc(s.name) + '" title="' + esc(s.name) + '"><i class="' + esc(s.icon) + '"></i></a>';
  }).join('') + '</div>';
}

function portraitHTML(p, showBadge) {
  if (showBadge === undefined) showBadge = true;
  var tpl = document.body.getAttribute('data-template');
  var ini = esc(p.initials || 'MAS');
  var img = p.photoUrl
    ? '<img src="' + esc(safeUrl(p.photoUrl)) + '" alt="' + esc(p.firstName + ' ' + p.lastName) + '" loading="eager" decoding="async" onerror="this.parentNode.innerHTML=\'<div class=portrait-fallback>' + ini + '</div>\'">'
    : '<div class="portrait-fallback">' + ini + '</div>';
  var ring = '';
  if (tpl === 'octagon') {
    ring = '<svg class="oct-ring-svg" viewBox="0 0 260 260" aria-hidden="true"><polygon points="78,8 182,8 252,78 252,182 182,252 78,252 8,182 8,78" fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-dasharray="14 8" opacity=".75"/></svg>';
  } else if (tpl === 'nordic-slate') {
    ring = '<svg class="radial-svg" viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="118" fill="none" stroke="var(--muted)" stroke-width="14" stroke-dasharray="2 10" opacity=".45"/><circle cx="130" cy="130" r="98" fill="none" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4 10" opacity=".5"/></svg>';
  }
  var badge = (showBadge && p.floatBadge && tpl !== 'midnight-horizon')
    ? '<span class="p-badge"><i class="fa-solid fa-atom"></i> ' + esc(p.floatBadge) + ' · ' + esc(p.yearsExp || '3+') + ' Yrs</span>' : '';
  return '<div class="portrait-box rv">' + ring + '<div class="portrait-inner">' + img + '</div>' + badge + '</div>';
}

function secHeadObj(s, num) {
  s = s || {};
  return '<div class="sec-head rv"><div>' +
    (s.kicker ? '<span class="eyebrow">' + esc(s.kicker) + '</span>' : '') +
    '<h2>' + esc(s.title || '') + ' <span class="accent">' + esc(s.accent || '') + '</span></h2>' +
    (s.sub ? '<p>' + esc(s.sub) + '</p>' : '') +
    '</div><span class="sec-num">' + (num < 10 ? '0' + num : num) + '</span></div>';
}
function secHead(k, num) { return secHeadObj(CFG.sections && CFG.sections[k], num); }

function getOrderedSectionIds() {
  var customIds = (CFG.customSections || []).map(function(x) { return x.id; });
  var valid = DEFAULT_ORDER.concat(customIds);
  var saved = Array.isArray(CFG.order) ? CFG.order.filter(function(id) { return valid.indexOf(id) !== -1; }) : [];
  var missing = valid.filter(function(id) { return saved.indexOf(id) === -1; });
  return saved.concat(missing);
}

function renderNav(tpl) {
  var p = CFG.profile;
  var navItems = [];
  if (show('hero') && CFG.sections.hero && CFG.sections.hero.nav) {
    navItems.push({ id: 'home', label: CFG.sections.hero.nav });
  }
  getOrderedSectionIds().forEach(function(id) {
    var cs = (CFG.customSections || []).filter(function(x) { return x.id === id; })[0];
    if (cs) {
      if (cs.show !== false && cs.nav) navItems.push({ id: cs.id, label: cs.nav });
    } else if (CFG.sections[id] && CFG.sections[id].show !== false && CFG.sections[id].nav) {
      navItems.push({ id: id, label: CFG.sections[id].nav });
    }
  });
  var links = navItems.map(function(item) {
    return '<a href="#' + esc(item.id) + '" data-sec="' + esc(item.id) + '">' + esc(item.label) + '</a>';
  }).join('');

  var brand = '<a href="#home" class="brand"><span class="brand-mark">' + esc((p.initials || 'MAS').slice(0, 3)) + '</span><span class="brand-name">' + esc(p.brand || p.firstName) + '<small>' + esc((p.roles && p.roles[0]) || 'Portfolio') + '</small></span></a>';
  var cta = '<a href="#contact" class="btn btn-primary nav-cta mag"><span class="bfill"></span>' + esc((CFG.nav && CFG.nav.cta) || 'Contact') + ' <i class="fa-solid fa-arrow-right"></i></a>';
  var mobBtn = '<button class="mob-open" id="mob-open" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>';

  if (tpl === 'editorial-light') {
    $('#nav-c').innerHTML = '<div class="nav-pill-bar">' + brand + '<nav class="nav-links" id="nav-links">' + links + '</nav>' + mobBtn + '</div>';
  } else {
    $('#nav-c').innerHTML = brand + '<nav class="nav-links" id="nav-links">' + links + '</nav><div class="nav-right">' + cta + mobBtn + '</div>';
  }
  $('#drawer-links').innerHTML = links;
  var socFoot = activeSocials().map(function(s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>'; });
  if (p.email) socFoot.push('<a href="mailto:' + esc(p.email) + '">Email</a>');
  if (p.whatsapp) socFoot.push('<a href="https://wa.me/' + esc(String(p.whatsapp).replace(/\D/g, '')) + '" target="_blank" rel="noopener">WhatsApp</a>');
  $('#drawer-foot').innerHTML = socFoot.join('');
  var mo = $('#mob-open');
  if (mo) mo.onclick = function() { toggleDrawer(true); };
}

      '<div class="hero-role rv" style="--d:.08s">Working as <span id="typer-text"></span></div><p class="hero-bio rv" style="--d:.12s">' + esc(p.intro) + '</p>' + btns + '</div>' +

    '<div><span class="hero-hello rv">' + esc(p.hello) + '</span><h1 class="rv">' + esc(p.firstName) + ' <span class="accent">' + esc(p.lastName) + '</span></h1>' +
    '<div class="hero-role rv" style="--d:.08s"><span id="typer-text"></span></div><p class="hero-bio rv" style="--d:.12s">' + esc(p.intro) + '</p>' + btns + '</div>' +

function renderServicesHTML(tpl) {
  var services = CFG.services || [];
  if (tpl === 'dennis' || tpl === 'cyber-wave') {
    return '<div class="row-list">' + services.map(function(s, i) {

      '<div class="srv-ic"><i class="' + esc(ico(s.icon)) + '"></i></div><h3>' + esc(s.title) + '</h3><p>' + esc(s.desc) + '</p>' +
      '<div class="srv-go"><span>Request Service</span><i class="fa-solid fa-arrow-right"></i></div></div>';

function renderCustomSection(cs, num, alt) {
  if (!cs || cs.show === false) return '';
  var items = cs.items || [];
  var colCls = 'cs-grid c' + (cs.columns || 3);
  var inner = '';
  if (cs.type === 'cta') {
    inner = '<div class="cs-cta rv"><h2>' + esc(cs.title || '') + ' <span class="accent">' + esc(cs.accent || '') + '</span></h2>' +
      (cs.body ? '<p>' + esc(cs.body) + '</p>' : '') +
      '<div class="hero-cta-row" style="justify-content:center">' +
      (cs.buttonText ? '<a class="btn btn-primary mag" href="' + esc(safeUrl(cs.buttonUrl || '#contact')) + '"><span class="bfill"></span>' + esc(cs.buttonText) + '</a>' : '') +
      (cs.button2Text ? '<a class="btn btn-ghost mag" href="' + esc(safeUrl(cs.button2Url || '#contact')) + '"><span class="bfill"></span>' + esc(cs.button2Text) + '</a>' : '') +
      '</div></div>';
    return '<section class="sec ' + (alt ? 'alt' : '') + '" id="' + esc(cs.id) + '"><div class="container">' + inner + '</div></section>';
  }
  if (cs.type === 'text') {
    inner = '<div class="card rv"><p style="white-space:pre-wrap;color:var(--muted)">' + esc(cs.body || '') + '</p>' +
      (cs.buttonText ? '<div style="margin-top:16px"><a class="btn btn-primary" href="' + esc(safeUrl(cs.buttonUrl || '#contact')) + '"><span class="bfill"></span>' + esc(cs.buttonText) + '</a></div>' : '') + '</div>';
  } else if (cs.type === 'faq') {
    inner = '<div class="cs-faq">' + items.map(function(it) {
      return '<details class="rv"><summary>' + esc(it.title) + '</summary><p>' + esc(it.text) + '</p></details>';
    }).join('') + '</div>';
  } else {
    inner = '<div class="' + colCls + '">' + items.map(function(it) {
      var img = it.image ? '<img class="cs-img" src="' + esc(safeUrl(it.image)) + '" alt="' + esc(it.title || '') + '" loading="lazy">' : '';
      var tags = (it.tags && it.tags.length) ? '<div class="cs-tags">' + it.tags.map(function(t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>' : '';
      var link = it.link ? '<div style="margin-top:14px"><a class="btn btn-ghost" style="padding:8px 16px;font-size:12.5px" href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener"><span class="bfill"></span>' + esc(it.linkText || 'View') + '</a></div>' : '';
      return '<div class="card rv">' + img + (it.subtitle ? '<span class="chip" style="margin-bottom:8px">' + esc(it.subtitle) + '</span>' : '') +
        (it.title ? '<h3 style="font-size:17px;margin-bottom:6px">' + esc(it.title) + '</h3>' : '') +
        (it.text ? '<p style="font-size:13.8px;color:var(--muted)">' + esc(it.text) + '</p>' : '') + tags + link + '</div>';
    }).join('') + '</div>';
  }
  return '<section class="sec ' + (alt ? 'alt' : '') + '" id="' + esc(cs.id) + '"><div class="container">' + secHeadObj(cs, num) + inner + '</div></section>';
}

function render() {
  applyTheme();
  var tpl = document.body.getAttribute('data-template');
  document.title = (CFG.seo && CFG.seo.title) || DEFAULTS.seo.title;

  if (md) md.setAttribute('content', (CFG.seo && CFG.seo.description) || DEFAULTS.seo.description);
  renderNav(tpl);

  var p = CFG.profile || DEFAULTS.profile;
  var c = CFG.contact || DEFAULTS.contact;
  var wa = String(p.whatsapp || '').replace(/\D/g, '');

  var catMap = { All: true };
  var cats = ['All'];
  (CFG.skills || []).forEach(function(s) {
    if (s.category && !catMap[s.category]) { catMap[s.category] = true; cats.push(s.category); }

  if (cats.indexOf(skillFilter) === -1) skillFilter = 'All';
  var opts = (CFG.services || []).map(function(s) { return s.title; }).concat(['General Inquiry']);

  var n = 0;
  var altFlag = false;

      if (cs.show !== false) { altFlag = !altFlag; html += renderCustomSection(cs, ++n, altFlag); }

    }
    if (!show(id)) return;

    if (id === 'marquee') {
      if (CFG.marquee && CFG.marquee.length && tpl !== 'dennis') {
        html += '<div class="marquee"><div class="mq-track" id="sub-mq"></div></div>';

        '<div class="fact"><small>Base</small><strong>' + esc(p.location) + '</strong></div>' +
        '<div class="fact"><small>Current School</small><strong>' + esc(curCo) + '</strong></div>' +
        '<div class="fact"><small>Availability</small><strong>On-Site &amp; Online</strong></div></div>' +
        (tpl === 'dennis'
          ? '<button class="btn btn-round mag" onclick="openCV()"><span class="bfill"></span>View Resume</button>'

        }).join('') + '</div></div></div></div></section>';

        (p.email ? '<a class="c-row" href="mailto:' + esc(p.email) + '"><span class="c-ic"><i class="fa-solid fa-envelope"></i></span><div><small>Email</small><strong>' + esc(p.email) + '</strong></div></a>' : '') +
        (p.phone ? '<a class="c-row" href="tel:' + esc(p.phone) + '"><span class="c-ic"><i class="fa-solid fa-phone"></i></span><div><small>Phone / WhatsApp</small><strong>' + esc(p.phone) + '</strong></div></a>' : '') +
        (p.location ? '<div class="c-row"><span class="c-ic"><i class="fa-solid fa-location-dot"></i></span><div><small>' + esc(p.availability) + '</small><strong>' + esc(p.location) + '</strong></div></div>' : '') +
        contactSoc + '</div>' +
        '<div class="card rv" style="--d:.08s"><form id="contact-form" novalidate>' +
        '<input type="text" name="cf_website" class="hp" tabindex="-1" autocomplete="off">' +
        '<div class="fgrid"><div class="fg"><label>Your Name *</label><input name="cf_name" required placeholder="Full name"></div>' +
        '<div class="fg"><label>Your Email *</label><input name="cf_email" type="email" required placeholder="you@example.com"></div></div>' +
        '<div class="fgrid"><div class="fg"><label>Phone / WhatsApp</label><input name="cf_phone" type="tel" placeholder="+92 300 0000000"></div>' +
        '<div class="fg"><label>Service Needed *</label><select name="cf_service" id="cf-service">' + opts.map(function(o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="fg"><label>Message *</label><textarea name="cf_message" required placeholder="Share your class level, subject needs, or teaching opportunity..."></textarea></div>' +
        '<div class="f-actions"><button type="submit" class="btn btn-primary mag" id="cf-submit"><span class="bfill"></span><i class="fa-solid fa-paper-plane"></i> <span>Submit Inquiry</span></button>' +
        (c.whatsappButton && wa ? '<button type="button" class="btn btn-ghost btn-wa-clean mag" id="cf-wa"><span class="bfill"></span><i class="fa-brands fa-whatsapp"></i> Message on WhatsApp</button>' : '') +
        '</div><div class="status" id="cf-status"></div></form></div></div></div></section>';
    }
  });

  $('#app-root').innerHTML = html;

  var fSoc = [];
  if (!CFG.socials || CFG.socials.showFooter !== false) {
    activeSocials().forEach(function(s) { fSoc.push('<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>'); });
  }
  if (p.email) fSoc.push('<a href="mailto:' + esc(p.email) + '">Email</a>');
  if (wa) fSoc.push('<a href="https://wa.me/' + wa + '" target="_blank" rel="noopener">WhatsApp</a>');

  $('#footer-c').innerHTML = '<div class="f-top">' +
    '<a href="#home" class="brand f-brand"><span class="brand-mark">' + esc((p.initials || 'MAS').slice(0, 3)) + '</span><span class="brand-name">' + esc(p.firstName + ' ' + p.lastName) + '<small>' + esc((CFG.footer && CFG.footer.tagline) || '') + '</small></span></a>' +
    '<div class="f-meta"><div><small>Local Time</small><b id="local-clock">--:--</b></div><div><small>Location</small><b>' + esc(p.location) + '</b></div></div></div>' +
    '<div class="f-copy"><span>© ' + new Date().getFullYear() + ' ' + esc(p.firstName + ' ' + p.lastName) + '. ' + esc((CFG.footer && CFG.footer.text) || 'All Rights Reserved.') + '</span>' +
    '<div class="f-soc">' + fSoc.join('') + '</div></div>';

  var sw = $('#skills');
  if (sw) sw.addEventListener('click', function(e) {
    var b = e.target.closest('.tab'); if (!b) return;
    skillFilter = b.getAttribute('data-cat');
    sw.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t === b); });
    $('#skills-wrap').innerHTML = renderSkillsHTML(tpl);
    observeIn($('#skills-wrap'));
  });
  var cf = $('#contact-form'); if (cf) cf.addEventListener('submit', submitContact);
  var wb = $('#cf-wa'); if (wb) wb.onclick = sendWhatsApp;

  initMarquees(); observeIn(); startTyper(); bindMagnetic(); updateClock(); onScroll(); buildCV();
}

/* =========================================================
   SMOOTH DIRECTION-REACTIVE MARQUEE
   ========================================================= */
var mqPos = 0, mqDir = -1, mqRaf = null;
function initMarquees() {
  if (mqRaf) cancelAnimationFrame(mqRaf);
  var p = CFG.profile;
  var hmq = $('#hero-mq');
  if (hmq) {
    var unit = '<span class="mq-item">' + esc(p.firstName + ' ' + p.lastName) + ' —</span>';
    hmq.innerHTML = unit + unit + unit + unit + unit + unit;
  }
  var smq = $('#sub-mq');
  if (smq) {
    var sUnit = (CFG.marquee || []).map(function(m) { return '<span class="mq-item">' + esc(m) + '<i class="mq-dot"></i></span>'; }).join('');
    smq.innerHTML = sUnit + sUnit;
  }
  var el = hmq || smq;
  if (!el || !CFG.animations || !CFG.animations.enabled || !CFG.animations.marquee) return;
  var speed = hmq ? 0.9 : 0.65;
  function tick() {
    var half = el.scrollWidth / 2;
    if (half > 0) {
      mqPos += mqDir * speed;
      if (mqPos <= -half) mqPos += half;
      if (mqPos >= 0) mqPos -= half;
      el.style.transform = 'translate3d(' + mqPos + 'px,0,0)';
    }
    mqRaf = requestAnimationFrame(tick);
  }
  mqRaf = requestAnimationFrame(tick);
}

/* =========================================================
   OBSERVERS, MAGNETIC PHYSICS, SERVICE AUTO-SELECT & CLOCK
   ========================================================= */
var io = null;
function revealEl(el) {
  el.classList.add('in');
  if (el.getAttribute('data-w') !== null) el.style.width = el.getAttribute('data-w') + '%';
  if (el.getAttribute('data-ring') !== null) el.style.strokeDashoffset = 226 - (226 * (+el.getAttribute('data-ring') / 100));
  if (el.getAttribute('data-count') !== null && CFG.animations && CFG.animations.counters && !el.getAttribute('data-done')) {
    el.setAttribute('data-done', '1');
    var target = parseFloat(el.getAttribute('data-count'));
    if (!isNaN(target)) {
      var t0 = performance.now();
      (function step(t) {
        var k = Math.min(1, (t - t0) / 1000);
        el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    }
  }
}
function observeIn(root) {
  root = root || document;
  if (io && root === document) { io.disconnect(); io = null; }
  var els = root.querySelectorAll('.rv:not(.in),[data-w]:not(.in),[data-ring]:not(.in),[data-count]:not(.in)');
  if (!CFG.animations || !CFG.animations.enabled || !('IntersectionObserver' in window)) {
    els.forEach(revealEl);
    return;
  }
  document.body.classList.add('anim-armed');
  io = new IntersectionObserver(function(entries) {
    entries.forEach(function(en) {
      if (en.isIntersecting) { revealEl(en.target); io.unobserve(en.target); }
    });
  }, { threshold: 0.05, rootMargin: '0px 0px 40px 0px' });
  els.forEach(function(e) {
    var rect = e.getBoundingClientRect();
    if (rect.top < window.innerHeight + 60) revealEl(e);
    else io.observe(e);
  });
}

var typerId = 0;
function startTyper() {
  var el = $('#typer-text'); if (!el) return;
  var my = ++typerId;
  var roles = (CFG.profile.roles || []).filter(Boolean);
  if (!roles.length) return;
  if (!CFG.animations || !CFG.animations.enabled || !CFG.animations.typewriter) { el.textContent = roles.join(' · '); return; }
  var ri = 0, ci = 0, del = false;
  (function tick() {
    if (my !== typerId) return;
    var w = roles[ri % roles.length];
    ci += del ? -1 : 1; el.textContent = w.slice(0, ci);
    var wait = del ? 42 : (+CFG.animations.typeSpeed || 85);
    if (!del && ci >= w.length) { wait = 1600; del = true; }
    else if (del && ci <= 0) { del = false; ri++; wait = 300; }
    setTimeout(tick, wait);
  })();
}

function bindMagnetic() {
  if (!CFG.animations || !CFG.animations.enabled || !window.matchMedia || !window.matchMedia('(pointer:fine)').matches) return;
  document.querySelectorAll('.mag').forEach(function(b) {
    b.onpointermove = function(e) {
      var r = b.getBoundingClientRect();
      b.style.transform = 'translate(' + ((e.clientX - r.left - r.width / 2) * 0.16) + 'px,' + ((e.clientY - r.top - r.height / 2) * 0.2) + 'px)';
    };
    b.onpointerleave = function() { b.style.transform = ''; };
  });
}

function pickService(name) {
  var sel = $('#cf-service');
  if (sel) {
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].text === name) { sel.value = sel.options[i].value; break; }
    }
  }
  var target = $('#contact');
  if (target) target.scrollIntoView({ behavior: 'smooth' });
}

function updateClock() {
  var el = $('#local-clock'); if (!el) return;
  try {
    var opts = { hour: '2-digit', minute: '2-digit', hour12: true, timeZoneName: 'short' };
    if (CFG.profile.timezone) opts.timeZone = CFG.profile.timezone;
    el.textContent = new Intl.DateTimeFormat('en-US', opts).format(new Date());
  } catch (e) { el.textContent = 'PKT'; }
}
setInterval(updateClock, 30000);

function toggleDrawer(force) {
  var dr = $('#drawer');
  var open = force !== undefined ? force : !dr.classList.contains('open');
  dr.classList.toggle('open', open);
  $('#drawer-scrim').classList.toggle('open', open);
  $('#fab-menu').classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
$('#fab-menu').onclick = function() { toggleDrawer(); };
$('#drawer-scrim').onclick = function() { toggleDrawer(false); };
$('#drawer-links').addEventListener('click', function(e) { if (e.target.closest('a')) toggleDrawer(false); });
$('#toTop').onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };

var lastY = window.pageYOffset || 0;
function onScroll() {
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  var h = document.documentElement.scrollHeight - window.innerHeight;
  var p = h > 0 ? y / h : 0;
  if (Math.abs(y - lastY) > 2) mqDir = y > lastY ? -1 : 1;
  lastY = y;

  var nav = $('#nav'); if (nav) nav.classList.toggle('scrolled', y > 24);
  var fab = $('#fab-menu'); if (fab) fab.classList.toggle('show', y > 260);
  var prog = $('#progress'); if (prog) prog.style.width = (p * 100) + '%';
  var topBtn = $('#toTop'); if (topBtn) topBtn.classList.toggle('show', y > 520);

  var cur = 'home';
  document.querySelectorAll('#app-root > section[id]').forEach(function(s) {
    if (s.getBoundingClientRect().top <= 160) cur = s.id;
  });
  document.querySelectorAll('#nav-links a, #drawer-links a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('data-sec') === cur);
  });
}
window.addEventListener('scroll', onScroll, { passive: true });

/* CV Modal */

    '<div class="cv-contact"><div><b>Location:</b> ' + esc(p.location) + '</div><div><b>Phone:</b> ' + esc(p.phone) + '</div><div><b>Email:</b> ' + esc(p.email) + '</div></div></div>' +

function openCV() {
  if (CFG.profile && CFG.profile.cvUrl) { window.open(safeUrl(CFG.profile.cvUrl), '_blank', 'noopener'); return; }
  $('#cv-modal').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeCV() { $('#cv-modal').classList.remove('open'); document.body.style.overflow = ''; }
$('#cv-modal').addEventListener('click', function(e) { if (e.target.id === 'cv-modal') closeCV(); });
window.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeCV(); toggleDrawer(false); } });

/* Contact Form → Supabase + Gmail */
function setStatus(type, html) { var s = $('#cf-status'); if (s) { s.className = 'status show ' + type; s.innerHTML = html; } }
function submitContact(e) {
  e.preventDefault();
  var f = e.target;
  var val = function(n) { return (f.elements[n] && f.elements[n].value) ? f.elements[n].value.trim() : ''; };
  if (val('cf_website')) return;
  var payload = { name: val('cf_name'), email: val('cf_email'), phone: val('cf_phone'), service: val('cf_service'), message: val('cf_message') };
  if (!payload.name || !payload.message || !/^\S+@\S+\.\S+$/.test(payload.email)) {
    setStatus('warn', 'Please fill in your name, valid email, and message.');
    return;
  }
  if (IS_PREVIEW) { setStatus('info', 'Preview mode — submissions are disabled.'); return; }
  var C = CFG.contact, btn = $('#cf-submit'), lbl = btn.querySelector('span:last-child');
  btn.disabled = true; if (lbl) lbl.textContent = 'Sending...';

  var p1 = (C.saveToSupabase && sb)
    ? sb.from('contact_messages').insert([payload]).then(function(r) { return !r.error; }).catch(function() { return false; })
    : Promise.resolve(false);

  var p2 = (C.sendGmail && C.gmailTo)
    ? fetch('https://formsubmit.co/ajax/' + encodeURIComponent(C.gmailTo), {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ _subject: 'Portfolio Inquiry: ' + payload.service + ' from ' + payload.name, _template: 'table', _captcha: 'false', _replyto: payload.email, Name: payload.name, Email: payload.email, Phone: payload.phone || 'Not provided', Service: payload.service, Message: payload.message })
      }).then(function(r) { return r.json().then(function(j) { return r.ok && String(j.success) !== 'false'; }).catch(function() { return r.ok; }); }).catch(function() { return false; })
    : Promise.resolve(false);

  Promise.all([p1, p2]).then(function(res) {
    btn.disabled = false; if (lbl) lbl.textContent = 'Submit Inquiry';
    if (res[0] || res[1]) { setStatus('ok', '✅ ' + esc(C.successMsg)); f.reset(); }
    else {
      setStatus('warn', 'Opening Gmail so you can send directly.');
      window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(C.gmailTo || CFG.profile.email) + '&su=' + encodeURIComponent('Portfolio Inquiry: ' + payload.service) + '&body=' + encodeURIComponent('Name: ' + payload.name + '\nEmail: ' + payload.email + '\nPhone: ' + payload.phone + '\nService: ' + payload.service + '\n\n' + payload.message), '_blank');
    }
  });
}
function sendWhatsApp() {
  var f = $('#contact-form');
  var val = function(n) { return (f.elements[n] && f.elements[n].value) ? f.elements[n].value.trim() : ''; };
  var text = 'Hello ' + CFG.profile.firstName + ' ' + CFG.profile.lastName + ',\n\n*Name:* ' + (val('cf_name') || 'Visitor') + '\n*Service:* ' + val('cf_service') + '\n*Message:* ' + (val('cf_message') || 'I would like to connect regarding Physics/Mathematics classes.');
  window.open('https://wa.me/' + String(CFG.profile.whatsapp || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(text), '_blank');
}

/* =========================================================
   INSTANT BOOT + ASYNC SUPABASE SYNC (Zero Blocking!)
   ========================================================= */
try {
  render();
} catch (err) {
  console.error('Render error:', err);
} finally {
  if (!CFG.animations || !CFG.animations.preloader || !CFG.animations.enabled || IS_PREVIEW) {
    hidePreloader();
  } else {
    var words = ['Hello', 'Welcome'], wi = 0;
    var iv = setInterval(function() {
      wi++;
      var txt = $('#pl-txt');
      if (wi < words.length && txt) txt.textContent = words[wi];
      else { clearInterval(iv); hidePreloader(); }
    }, 240);
  }
}

function initSupabaseSync() {
  if (sb || IS_PREVIEW) return;
  try {
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      sb.from('site_settings').select('data').eq('id', SETTINGS_ID).maybeSingle().then(function(res) {
        if (res && res.data && res.data.data) {
          var clean = normalizeConfig(res.data.data, false);
          var fresh = JSON.stringify(clean);
          if (fresh !== JSON.stringify(readCache())) {
            writeCache(clean);
            CFG = merge(DEFAULTS, clean);
            render();
          }
        }
      }).catch(function() {});
    }
  } catch (e) {}
}
window._onSbReady = initSupabaseSync;
if (window.supabase) initSupabaseSync();

if (IS_PREVIEW) {
  window.addEventListener('message', function(e) {
    if (e.source !== window.parent || !e.data || (e.data.type !== 'portfolio-preview' && e.data.type !== 'sfh-preview')) return;
    CFG = merge(DEFAULTS, normalizeConfig(e.data.config, true));
    render();
  });
  window.parent.postMessage({ type: 'portfolio-ready' }, '*');
  window.parent.postMessage({ type: 'sfh-ready' }, '*');
}
